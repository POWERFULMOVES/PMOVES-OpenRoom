gzip on;

gzip_min_length 1k;

gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript;

gzip_vary on;

access_log /var/log/nginx/access.log main;
error_log /var/log/nginx/error.log error;

# PMOVES room manifests are mounted read-only from the monorepo:
#   -v $PWD/pmoves/config/rooms:/etc/pmoves/rooms:ro
# See PMOVES-OpenRoom/HARDENING.md for the full set of mounts.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# P7 upstream — deliberately NOT an `upstream {}` block.
#
# TARGET (unchanged, established by the commit before this one): the P7 control
# plane runs as TWO services — `p7` (:8120, rooms list/get + transition) and
# `p7-room-orchestrator` (:8122, which ALSO hosts POST /rooms/{id}/session, the
# call this proxy exists to serve). Route-verified against both services'
# openapi.json: the session endpoint lives only on the legacy service.
#
# WHY NOT `upstream {}`: nginx resolves a literal server name in an upstream
# block when it LOADS the config, and aborts the process if resolution fails:
#
#     [emerg] host not found in upstream "p7-room-orchestrator:8120"
#
# So one unreachable upstream took down every route this file serves, including
# the static app, which has nothing to do with P7. Measured on PMOVES-4090
# 2026-09-04: 758 restarts, with the container dead the entire time.
#
# The port fix alone does not remove that coupling — it only makes the name
# resolvable while P7 happens to be up. P7 is in the `agents`/`orchestration`
# profiles, so any bring-up that omits them leaves this container crash-looping
# again for a reason that has nothing to do with OpenRoom.
#
# Fixed with the documented mechanism, not a workaround. nginx proxy_pass docs
# (nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_pass): "Parameter
# value can contain variables. In this case, if an address is specified as a
# domain name, the name is searched among the described server groups, and, if
# not found, is determined using a resolver." Hence: no upstream{} group (it
# would win the group lookup and re-introduce load-time resolution), a variable
# address, and a declared resolver. nginx then starts regardless, and an absent
# P7 degrades to 502 on /api/p7/ instead of killing the container.
#
# Do NOT restore the upstream{} block, and do NOT paper over a name mismatch
# with a compose network alias: `p7-room-orchestrator` is a real service on
# pmoves_app, so an alias pointing elsewhere collides with it and Docker DNS
# round-robins between the two — intermittent failures, which are harder to
# diagnose than the crash loop this replaced.

server {
    listen 3000;
    server_name default_server;

    # PMOVES room manifests (openroom-adapter lane, 2026-07-24).
    # Served read-only from the volume-mounted manifest dir. The catalog
    # (catalog.json) maps each room_id to its manifest filename; the nginx
    # location reads the catalog via a small Lua subrequest, but most PMOVES
    # operators use the `manifest` field directly. When the room_id matches
    # the manifest filename (e.g. 4090-field.room.control), the alias below
    # resolves correctly; when they differ (e.g. demo.room.rehearsal ->
    # demo.room.json), the alias falls back to looking up the catalog
    # variable. For maximum compatibility, the alias is the catalog-based
    # resolver implemented in a small helper script at
    # /etc/pmoves/rooms-resolver.lua. For now, this location serves
    # file-paths that follow the `<room_id>.json` convention; rooms with
    # divergent filenames need a re-pointed volume mount.
    location ~ ^/api/rooms/([a-z0-9._-]+)\.json$ {
        # No try_files here: inside a REGEX location with alias, $uri is the
        # ORIGINAL request path (/api/rooms/x.json), which never matches the
        # aliased filesystem path — so try_files always fell through to =404
        # and every manifest 404'd (verified live: all 13 rooms 404 despite
        # files present in the mount). The regex already constrains the name;
        # a missing file 404s via alias itself.
        alias /etc/pmoves/rooms/$1.json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        default_type application/json;
    }

    # P7 control plane proxy. The room adapter calls
    # POST /api/p7/rooms/{id}/session on enter/leave to bind a P7 session
    # bound to the room's stage. Bearer auth is forwarded so the
    # P7_CONTROL_TOKEN on this container applies.
    location /api/p7/ {
        # Docker embedded DNS; short TTL so a recreated P7 is picked up.
        resolver 127.0.0.11 ipv6=off valid=10s;
        # A VARIABLE here means nginx resolves per request instead of at config
        # load. See the sourced note at the top of this file: a literal upstream
        # name that does not resolve aborts the entire nginx process.
        set $p7_upstream "p7-room-orchestrator:8122";
        proxy_pass http://$p7_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    location /webuiapps/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /webuiapps/index.html;
    }

    location = /webuiapps {
        return 301 /webuiapps/;
    }

    # 5xx handling with NO file dependency.
    #
    # This was `error_page 500 502 503 504 /50x.html;` with
    # `location = /50x.html { root html; }`. `root html` is relative to the
    # nginx prefix, so it resolved to <prefix>/html/50x.html — a path this image
    # does not have (the app is served from /usr/share/nginx/html, and the build
    # output ships no 50x.html). The error page therefore ALWAYS failed:
    #
    #   [error] open() ".../html/50x.html" failed (2: No such file or directory)
    #
    # nginx then fell back to 404, so a genuinely unreachable upstream reported
    # "not found" instead of "bad gateway". Observed on PMOVES-4090 2026-09-04
    # while verifying the P7 fix: with P7 stopped, /api/p7/ returned 404. A
    # wrong status on an outage sends whoever is debugging it hunting a routing
    # mistake instead of a dead service.
    #
    # NO error_page DIRECTIVE, DELIBERATELY. nginx's built-in pages are already
    # correct here, and every custom version of this block was worse.
    #
    # The bug was never that nginx lacked a 502 page. It was `root html;`
    # pointing at an /etc/nginx/html/50x.html that does not exist in this image,
    # so nginx failed to open its own error page and fell back to 404 -- a dead
    # upstream reported "not found". Removing the directive removes the missing
    # file, and nginx serves its compiled-in page.
    #
    # The first replacement, `error_page 500 502 503 504 = @upstream_error`,
    # traded that bug for a worse one. Per the error_page docs, the `=` form
    # takes the response code from the handler, so the handler's `return 502`
    # rewrote 500, 503 and 504 to 502 -- a P7 that accepts the connection and
    # then exceeds proxy_read_timeout produces a 504, and this reported it as a
    # refused connection. (chatgpt-codex P2 on PR #8.)
    #
    # Measured, three configurations, upstream forced to 503 and to unreachable:
    #
    #   directive                          503 ->   dead ->   body
    #   error_page 500 502 503 504 = @err   502      502      upstream unavailable
    #   error_page 502 = @err               503      502      upstream unavailable
    #   (none)                              503      502      502 Bad Gateway
    #
    # The last row needs no configuration to justify and cannot regress the
    # `=` semantics, because there is no `=`. The custom body was the only
    # thing the other two bought.
    #
    # https://nginx.org/en/docs/http/ngx_http_core_module.html#error_page
}
