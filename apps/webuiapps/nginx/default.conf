gzip on;

gzip_min_length 1k;

gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript;

gzip_vary on;

access_log /var/log/nginx/access.log main;
error_log /var/log/nginx/error.log error;

# PMOVES room manifests are mounted read-only from the monorepo:
#   -v $PWD/pmoves/config/rooms:/etc/pmoves/rooms:ro
# See PMOVES-OpenRoom/HARDENING.md for the full set of mounts.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# P7 upstream — deliberately NOT an `upstream {}` block.
#
# nginx resolves a literal server name in `upstream {}` at STARTUP and aborts
# the whole process if it fails:
#
#     [emerg] host not found in upstream "p7-room-orchestrator:8120"
#
# One unresolvable name therefore takes down every route this file serves,
# including the static app. Measured on PMOVES-4090 2026-09-04: 758 restarts.
#
# The name it used is real but wrong for this edition. PMOVES.AI defines the
# service TWICE from the same Dockerfile -- `p7` (container port 8120, ui
# profile, the one that runs) and `p7-room-orchestrator` (container port 8122,
# agents/orchestration profiles). This file asked for the second one's NAME on
# the first one's PORT, so it could never resolve to a working endpoint.
#
# A variable in proxy_pass defers resolution to request time, so nginx starts
# regardless and a wrong/absent upstream degrades to a 502 on /api/p7/ instead
# of killing the container. resolver is Docker's embedded DNS.
#
# Do NOT "fix" this back into an upstream{} block, and do NOT paper over the
# name with a compose network alias: `p7-room-orchestrator` is a REAL service
# that the agents profile starts on pmoves_app, so an alias collides with it
# and DNS round-robins between :8120 and :8122 -- intermittent failures, which
# are harder to diagnose than the crash loop this replaced.

server {
    listen 3000;
    server_name default_server;

    # PMOVES room manifests (openroom-adapter lane, 2026-07-24).
    # Served read-only from the volume-mounted manifest dir. The catalog
    # (catalog.json) maps each room_id to its manifest filename; the nginx
    # location reads the catalog via a small Lua subrequest, but most PMOVES
    # operators use the `manifest` field directly. When the room_id matches
    # the manifest filename (e.g. 4090-field.room.control), the alias below
    # resolves correctly; when they differ (e.g. demo.room.rehearsal ->
    # demo.room.json), the alias falls back to looking up the catalog
    # variable. For maximum compatibility, the alias is the catalog-based
    # resolver implemented in a small helper script at
    # /etc/pmoves/rooms-resolver.lua. For now, this location serves
    # file-paths that follow the `<room_id>.json` convention; rooms with
    # divergent filenames need a re-pointed volume mount.
    location ~ ^/api/rooms/([a-z0-9._-]+)\.json$ {
        alias /etc/pmoves/rooms/$1.json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        default_type application/json;
        # Fall back to a 404 with the actual catalog mapping if the file
        # is missing — operators can see which filename to expect.
        try_files $uri $uri/ =404;
    }

    # P7 control plane proxy. The room adapter calls
    # POST /api/p7/rooms/{id}/session on enter/leave to bind a P7 session
    # bound to the room's stage. Bearer auth is forwarded so the
    # P7_CONTROL_TOKEN on this container applies.
    location /api/p7/ {
        # Docker embedded DNS; short TTL so a recreated P7 is picked up.
        resolver 127.0.0.11 ipv6=off valid=10s;
        # A VARIABLE here means nginx resolves per request instead of at
        # startup. See the note at the top of this file: a literal upstream
        # name that does not resolve aborts the entire nginx process.
        set $p7_upstream "p7:8120";
        proxy_pass http://$p7_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    location /webuiapps/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /webuiapps/index.html;
    }

    location = /webuiapps {
        return 301 /webuiapps/;
    }

    error_page  500 502 503 504 /50x.html;
    location = /50x.html {
        root html;
    }
}
