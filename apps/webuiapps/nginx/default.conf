gzip on;

gzip_min_length 1k;

gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript;

gzip_vary on;

access_log /var/log/nginx/access.log main;
error_log /var/log/nginx/error.log error;

# PMOVES room manifests are mounted read-only from the monorepo:
#   -v $PWD/pmoves/config/rooms:/etc/pmoves/rooms:ro
# See PMOVES-OpenRoom/HARDENING.md for the full set of mounts.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# P7 upstream — deliberately NOT an `upstream {}` block.
#
# TWO defects were fixed here on 2026-09-04. Both are sourced below.
#
# 1. WRONG PORT. This file proxied to `p7-room-orchestrator:8120`. The
#    canonical P7 control plane listens on 8122, not 8120:
#      PMOVES.AI pmoves/docs/AGENTS/AGNOTE4482.md:36 — "pmoves/services/
#      p7-room-orchestrator/ is the executable control-plane implementation on
#      port 8122", and :1441 — "P7 is wired as `p7-room-orchestrator` on 8122
#      in Compose, the agent registry, orchestration team, service/port
#      catalogs".
#    Verified on PMOVES-4090 2026-09-04, from pmoves_app:
#      p7-room-orchestrator:8122/healthz -> 200
#    The service NAME here was always right; only the port was wrong. (This
#    repo's own HARDENING.md also said 8120 and has been corrected.)
#
# 2. STARTUP RESOLUTION. nginx resolves a literal server name in `upstream {}`
#    when it loads the config and ABORTS the process if it fails:
#      [emerg] host not found in upstream "p7-room-orchestrator:8120"
#    So one unresolvable name took down every route in this file, including the
#    static app, which has nothing to do with P7. Measured: 758 restarts.
#
#    Fixed with the documented nginx mechanism, not a workaround. nginx
#    proxy_pass docs (nginx.org/en/docs/http/ngx_http_proxy_module.html
#    #proxy_pass): "Parameter value can contain variables. In this case, if an
#    address is specified as a domain name, the name is searched among the
#    described server groups, and, if not found, is determined using a
#    resolver." Hence: no upstream{} group (or it would win the lookup), a
#    variable in proxy_pass, and a resolver. nginx then starts regardless and an
#    absent upstream degrades to 502 on /api/p7/ instead of killing the
#    container.
#
# Do NOT turn this back into an upstream{} block, and do NOT paper over a name
# mismatch with a compose network alias: `p7-room-orchestrator` is a REAL
# service on pmoves_app, so an alias pointing elsewhere collides with it and
# Docker DNS round-robins between the two — intermittent failures, which are
# harder to diagnose than the crash loop this replaced.

server {
    listen 3000;
    server_name default_server;

    # PMOVES room manifests (openroom-adapter lane, 2026-07-24).
    # Served read-only from the volume-mounted manifest dir. The catalog
    # (catalog.json) maps each room_id to its manifest filename; the nginx
    # location reads the catalog via a small Lua subrequest, but most PMOVES
    # operators use the `manifest` field directly. When the room_id matches
    # the manifest filename (e.g. 4090-field.room.control), the alias below
    # resolves correctly; when they differ (e.g. demo.room.rehearsal ->
    # demo.room.json), the alias falls back to looking up the catalog
    # variable. For maximum compatibility, the alias is the catalog-based
    # resolver implemented in a small helper script at
    # /etc/pmoves/rooms-resolver.lua. For now, this location serves
    # file-paths that follow the `<room_id>.json` convention; rooms with
    # divergent filenames need a re-pointed volume mount.
    location ~ ^/api/rooms/([a-z0-9._-]+)\.json$ {
        alias /etc/pmoves/rooms/$1.json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        default_type application/json;
        # Fall back to a 404 with the actual catalog mapping if the file
        # is missing — operators can see which filename to expect.
        try_files $uri $uri/ =404;
    }

    # P7 control plane proxy. The room adapter calls
    # POST /api/p7/rooms/{id}/session on enter/leave to bind a P7 session
    # bound to the room's stage. Bearer auth is forwarded so the
    # P7_CONTROL_TOKEN on this container applies.
    location /api/p7/ {
        # Docker embedded DNS; short TTL so a recreated P7 is picked up.
        resolver 127.0.0.11 ipv6=off valid=10s;
        # A VARIABLE here means nginx resolves per request instead of at config
        # load. See the sourced note at the top of this file: a literal upstream
        # name that does not resolve aborts the entire nginx process.
        # Port 8122 is canonical (AGNOTE4482.md:36,1441) — NOT 8120.
        set $p7_upstream "p7-room-orchestrator:8122";
        proxy_pass http://$p7_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    location /webuiapps/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /webuiapps/index.html;
    }

    location = /webuiapps {
        return 301 /webuiapps/;
    }

    # 5xx handling with NO file dependency.
    #
    # This used to be `error_page 500 502 503 504 /50x.html;` with
    # `location = /50x.html { root html; }`. `root html` is relative to the
    # nginx prefix, so it resolved to <prefix>/html/50x.html -- a path this
    # image does not have. The app is served from /usr/share/nginx/html and the
    # build output ships no 50x.html either, so the error page ALWAYS failed:
    #
    #   [error] open() ".../html/50x.html" failed (2: No such file or directory)
    #
    # nginx then fell back to 404, so a genuinely unreachable upstream reported
    # "not found" instead of "bad gateway" -- observed 2026-09-04 while
    # verifying the P7 upstream fix, where /api/p7/ returned 404 with p7
    # stopped. A wrong status code on an outage sends whoever is debugging it
    # looking for a routing mistake instead of a dead service.
    #
    # An inline `return` has nothing to lose: no file, no root, no fallback.
    error_page 500 502 503 504 = @upstream_error;
    location @upstream_error {
        default_type text/plain;
        return 502 "upstream unavailable\n";
    }
}
