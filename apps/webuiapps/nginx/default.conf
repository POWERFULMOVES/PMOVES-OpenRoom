gzip on;

gzip_min_length 1k;

gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript;

gzip_vary on;

access_log /var/log/nginx/access.log main;
error_log /var/log/nginx/error.log error;

server {
    listen 3000;
    server_name default_server;

    location /webuiapps/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /webuiapps/index.html;
    }

    location = /webuiapps {
        return 301 /webuiapps/;
    }

    location = / {
        return 301 /webuiapps/;
    }

    # PMOVES room manifests, served from the read-only rooms volume mount
    # (compose: ./config/rooms:/etc/pmoves/rooms:ro).
    location /api/rooms/ {
        alias /etc/pmoves/rooms/;
        index catalog.json;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    error_page  500 502 503 504 /50x.html;
    location = /50x.html {
        root html;
    }
}
